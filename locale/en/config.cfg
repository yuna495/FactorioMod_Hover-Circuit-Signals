[mod-name]
Hover-Circuit-Signals=Hover Circuit Signals

[mod-description]
Hover-Circuit-Signals=Displays circuit network signals when hovering over entities without needing to open them.

[controls]
hover-circuit-signals-toggle=Toggle Hover Circuit Signals

[hover-circuit-signals]
title=Circuit Signals
input=Input
output=Output
red=Red
green=Green
more-signals=+__1__
msg-enabled=Hover Circuit Signals: Enabled
msg-disabled=Hover Circuit Signals: Disabled
tooltip-signal-val=Signal count: __1__
tooltip-net-id=Network: __1__ #__2__
tooltip-terminal=Terminal: __1__
tooltip-more-signals=And __1__ more signals

[mod-setting-name]
hover-circuit-signals-enabled=Enable Hover Circuit Signals
hover-circuit-signals-offset-x=Right Offset (px)
hover-circuit-signals-offset-y=Bottom Offset (px)
hover-circuit-signals-columns=Columns
hover-circuit-signals-max-signals=Max Signals Shown
hover-circuit-signals-update-interval=Update Interval (ticks)
hover-circuit-signals-show-network-id=Show Network ID
hover-circuit-signals-compact-numbers=Compact Number Format
hover-circuit-signals-separate-io=Separate Input / Output
hover-circuit-signals-separate-wire-color=Separate Red / Green Wires
hover-circuit-signals-sort-order=Signal Sort Order

[mod-setting-description]
hover-circuit-signals-enabled=Enable or disable hover circuit signals window.
hover-circuit-signals-offset-x=Horizontal distance from bottom-right of screen to top-left of window.
hover-circuit-signals-offset-y=Vertical distance from bottom-right of screen to top-left of window.
hover-circuit-signals-columns=Number of signal icons per row.
hover-circuit-signals-max-signals=Maximum total signals to display.
hover-circuit-signals-update-interval=Interval between signal refresh cycles in ticks.
hover-circuit-signals-show-network-id=Display circuit network ID in headers.
hover-circuit-signals-compact-numbers=Format numbers with k, M, G suffixes (e.g. 12k).
hover-circuit-signals-separate-io=Display input and output terminals in separate sections.
hover-circuit-signals-separate-wire-color=Display red and green wire networks in separate sections.
hover-circuit-signals-sort-order=Order in which signals are sorted.

[string-mod-setting]
hover-circuit-signals-sort-order-prototype=Prototype Order
hover-circuit-signals-sort-order-name=Signal Name
hover-circuit-signals-sort-order-count-desc=Count (Highest First)
