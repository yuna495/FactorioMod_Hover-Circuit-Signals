[mod-name]
Hover-Circuit-Signals=Hover Circuit Signals

[mod-description]
Hover-Circuit-Signals=エンティティにマウスオーバーするだけで回路信号を表示します。

[controls]
hover-circuit-signals-toggle=Hover Circuit Signals 表示切替

[hover-circuit-signals]
title=回路信号
input=入力
output=出力
red=赤
green=緑
more-signals=+__1__
msg-enabled=Hover Circuit Signals：表示オン
msg-disabled=Hover Circuit Signals：表示オフ
tooltip-signal-val=信号値：__1__
tooltip-net-id=ネットワーク：__1__ #__2__
tooltip-terminal=端子：__1__
tooltip-more-signals=他 __1__ 件の信号

[mod-setting-name]
hover-circuit-signals-enabled=Mod表示有効
hover-circuit-signals-offset-x=右方向オフセット (px)
hover-circuit-signals-offset-y=下方向オフセット (px)
hover-circuit-signals-columns=1行の列数
hover-circuit-signals-max-signals=最大表示信号数
hover-circuit-signals-update-interval=更新間隔 (tick)
hover-circuit-signals-show-network-id=回路ネットワークIDを表示
hover-circuit-signals-compact-numbers=数値を省略表示
hover-circuit-signals-separate-io=入出力端子を分離表示
hover-circuit-signals-separate-wire-color=赤線と緑線を分離表示
hover-circuit-signals-sort-order=信号の並び順

[mod-setting-description]
hover-circuit-signals-enabled=マウスオーバー時の回路信号ウィンドウ表示を有効にします。
hover-circuit-signals-offset-x=画面右下からウィンドウ左上までの横方向の距離を指定します。
hover-circuit-signals-offset-y=画面右下からウィンドウ左上までの縦方向の距離を指定します。
hover-circuit-signals-columns=信号アイコンを1行に表示する列数。
hover-circuit-signals-max-signals=ウィンドウ全体で表示する最大信号数。
hover-circuit-signals-update-interval=信号の再取得・更新を行う間隔 (1-120 tick)。
hover-circuit-signals-show-network-id=見出しに回路ネットワークIDを表示します。
hover-circuit-signals-compact-numbers=1000以上の数値を k, M, G などの単位で丸めて表示します。
hover-circuit-signals-separate-io=算術・判断回路などの入力端子と出力端子を区画分けして表示します。
hover-circuit-signals-separate-wire-color=赤線と緑線の信号を区画分けして表示します。
hover-circuit-signals-sort-order=信号アイコンの並び順を指定します。

[string-mod-setting]
hover-circuit-signals-sort-order-prototype=バニラ内部順 (プロトタイプ順)
hover-circuit-signals-sort-order-name=信号名順
hover-circuit-signals-sort-order-count-desc=数値順 (大きい順)
